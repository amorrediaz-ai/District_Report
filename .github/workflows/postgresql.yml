name: PostgreSQL tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: district_test
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: district_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U district_test -d district_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://district_test:local-test-password@127.0.0.1:5432/district_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_postgresql.py
      - run: python -m pip install playwright
      - run: npm install --prefix ../browser-test-runtime --ignore-scripts --no-audit --no-fund leaflet@1.9.4
      - run: python -m pytest -q tests/test_browser.py
        env:
          PLAYWRIGHT_CHANNEL: chrome
